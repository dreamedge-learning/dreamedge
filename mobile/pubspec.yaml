name: mobile
description: "Dream Edge - Online Education Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI & utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.20.2

  # Storage
  shared_preferences: ">=2.5.3 <4.0.0"
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.4

  # URL launcher
  url_launcher: ^6.3.1

  # App metadata, used to stamp the running build onto student feedback.
  # wakelock_plus already pulls in package_info_plus 9.x, so the constraint
  # has to sit on that major or the resolver downgrades wakelock_plus.
  package_info_plus: ^9.0.1

  # Photos for doubts. Android's system photo picker and camera intent need no
  # runtime permission, so the manifest gains nothing; the picker also scales
  # the photo down before handing it over.
  image_picker: ^1.1.2

  # Video player
  #
  # No chewie. ExoPlayer plays HLS natively through video_player, and the
  # gesture set this app needs -- double-tap seeking, vertical drags for
  # brightness and volume, a control lock -- means owning the control layer
  # rather than theming somebody else's.
  video_player: ^2.9.2
  wakelock_plus: ^1.2.10
  screen_brightness: ^2.1.2
  volume_controller: ^3.3.3

  # Documents. The app had no PDF viewer at all, which is a gap offline mode
  # cannot have: half the downloadable content is booklets and past papers.
  #
  # The 1.x line does not compile under Dart 3.13 -- there are unsound null
  # checks inside the package that the current compiler rejects -- so this is
  # on 2.x, which is why `intl` moved to 0.20 with it. Note that 2.x builds
  # PDFium from source as a native asset, so running `flutter test` on Windows
  # needs the Visual Studio C++ build tools. Building the Android APK does not.
  pdfrx: ^2.11.0

  # Offline downloads
  dio: ^5.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  crypto: ^3.0.6
  device_info_plus: ^11.2.0
  permission_handler: ^11.3.1

  # Firebase & notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Payments
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.5
  mockito: ^5.4.4

dependency_overrides:
  shared_preferences_android: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
