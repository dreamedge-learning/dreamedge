# Dream Edge Online — Supabase Configuration
# https://supabase.com/docs/guides/cli/config

[project]
id = "ubymqjdmeknoblkrlgrf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://dreamedge.online"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[auth.sms]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-razorpay-order]
verify_jwt = true

[functions.verify-razorpay-payment]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

[functions.video-playback-token]
verify_jwt = true
